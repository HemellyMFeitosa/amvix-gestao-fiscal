name: Deploy develop (homologação)

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-develop
  cancel-in-progress: true

jobs:
  qualidade:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: qualidade
    runs-on: ubuntu-latest
    environment:
      name: develop
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Conferir secrets da Vercel
        id: secrets
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Secrets VERCEL_TOKEN/VERCEL_ORG_ID/VERCEL_PROJECT_ID não configurados — deploy pulado."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Instalar Vercel CLI
        if: steps.secrets.outputs.ok == 'true'
        run: npm i -g vercel@latest

      - name: Baixar configuração (ambiente Preview)
        if: steps.secrets.outputs.ok == 'true'
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build
        if: steps.secrets.outputs.ok == 'true'
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        if: steps.secrets.outputs.ok == 'true'
        run: |
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Publicado em: $url" >> "$GITHUB_STEP_SUMMARY"
